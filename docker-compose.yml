# Local MongoDB server for CAPO. Not a cloud deployment.
# First start initializes capo_db and inserts fictional demo records.
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: capo_root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Copy .env.example to .env and set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: capo_db
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - capo_mongo_data:/data/db
      - ./database/mongodb:/workspace/database:ro
      - ./database/mongodb/init.js:/docker-entrypoint-initdb.d/01-init.js:ro
      - ./database/mongodb/seed.js:/docker-entrypoint-initdb.d/02-seed.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  capo_mongo_data:
